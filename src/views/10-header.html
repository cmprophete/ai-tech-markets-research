<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-text">
        <h1><a href="#about" id="homeTitleLink" aria-label="Home: about this site">AI Tracker: Research and Policy</a><span class="header-proto-tag" title="Work in progress — please do not cite or share these figures">Prototype</span></h1>
        <div class="header-proto-note">Work in progress &mdash; please do not cite or share these figures.</div>
      </div>
    </div>
    <nav class="header-nav" aria-label="Primary">
      <div class="header-tabs" role="tablist" aria-label="Select view">
        <!-- Three labelled groups, each tab above its group's label. Alphabetical within a group. The label is for the eye
             (aria-hidden), so a tab that would not make sense without its group says it in its accessible name, which still
             contains the visible text (Agenda says "Policy agenda", Landscape "Policy landscape" and Enforcement "Enforcement actions and key cases"; the others are clear alone). -->
        <div class="tab-group" data-group="research" role="presentation">
          <div class="tab-group-btns" role="presentation">
            <button class="header-nav-btn" id="viewFactBank" data-view="fact-bank" role="tab" aria-selected="false" aria-controls="viewPanel">Fact Bank</button>
            <button class="header-nav-btn" id="viewCards" data-view="cards" role="tab" aria-selected="false" aria-controls="viewPanel">Papers</button>
          </div>
          <div class="tab-group-label" aria-hidden="true">Research</div>
        </div>
        <div class="tab-group" data-group="policy" role="presentation">
          <div class="tab-group-btns" role="presentation">
            <button class="header-nav-btn" id="viewAgenda" data-view="agenda" role="tab" aria-selected="false" aria-controls="viewPanel" aria-label="Policy agenda">Agenda</button>
            <button class="header-nav-btn" id="viewPolicy" data-view="policy" role="tab" aria-selected="false" aria-controls="viewPanel" aria-label="Policy landscape">Landscape</button>
          </div>
          <div class="tab-group-label" aria-hidden="true">Policy</div>
        </div>
        <div class="tab-group" data-group="government" role="presentation">
          <div class="tab-group-btns" role="presentation">
            <button class="header-nav-btn" id="viewEnforcement" data-view="enforcement" role="tab" aria-selected="false" aria-controls="viewPanel" aria-label="Enforcement actions and key cases">Enforcement</button>
            <button class="header-nav-btn" id="viewLegislation" data-view="legislation" role="tab" aria-selected="false" aria-controls="viewPanel">Legislation</button>
          </div>
          <div class="tab-group-label" aria-hidden="true">Government action</div>
        </div>
      </div>
    </nav>
    <div style="display:none;">
      <button id="aboutInfoBtn" aria-label="About this site"></button>
      <button id="sourcesInfoBtn" aria-label="View sources"></button>
    </div>
  </div>
</header>

<div id="viewAnnounce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
