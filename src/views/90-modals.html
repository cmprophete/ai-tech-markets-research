<!-- Policy pop-out modal -->
<div class="modal-backdrop" id="polModal" role="dialog" aria-modal="true" aria-labelledby="polModalTitle">
  <div class="pol-modal">
    <div class="pol-modal-header">
      <div>
        <h2 class="pol-modal-title" id="polModalTitle"></h2>
        <div class="pol-modal-meta" id="polModalArea"></div>
      </div>
      <div class="pol-modal-actions" id="polModalActions"></div>
      <button class="pol-modal-close" id="polModalClose" aria-label="Close">✕</button>
    </div>
    <div class="pol-modal-body" id="polModalBody"></div>
  </div>
</div>

<!-- Priority Sources Modal -->
<div class="modal-backdrop" id="sourcesModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Sources</h2>
      <button class="modal-close" id="sourcesModalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="sourcesModalBody"></div>
  </div>
</div>
