      <!-- ── GOVERNMENT ACTION ── (the one nav tab, with four sections, All, Cases, Enforcement and Legislation, each a view of its own: routes #all, #cases, #enforcement, #legislation). One area serves all four, in this
           order from the top: the toolbar (the section switch, the Show menu, on Legislation and All the Status menu and the checkbox for the bills that only lightly mention AI, and at its right end the Reset button, which puts the whole tab back as it opens: no jurisdiction, no filter anywhere, the order reset, the All view), the topic chips,
           the search (and on Legislation the Sort menu), the result line, the map of the states with its card, and then the section's own list: the bills here (#legBillsSection), or the rows of data/legislation-actions.js (#enforcementArea, lower down), and on All all of them, in this order: the midterm
           results by state (#legResultsSection), the bills, the key cases and the enforcement actions. The map and the card are the same in all three (src/js/60-legislation.js builds everything above the lists from data/us-map.js, the
           outlines, data/legislation-data.js, the stages and the 2026 midterm results from the Associated Press, and data/legislation-bills.js, the bills, which are fetched the first time any of the three
           sections opens); src/js/55-enforcement.js draws the two lists. A control or a list that belongs to some of the sections carries gov-leg-only (the bills' own: Status, the checkbox, the topic chips, the search, Sort, the
           result line and the bills table: shown on All and Legislation), gov-lists-only (the lists' own: the chips, the search, a Sort menu and the result line, shown on Enforcement and Cases; the two Sort menus, #legSort and #enfSort, are one setting for the tab,
           legView.sort) or gov-all-only (the midterm results table: All alone, first), and src/styles/policy.css shows it only there. All is Legislation's controls, which then narrow the lists as well (their words and topics are the same vocabulary), and every list: the bills,
           the enforcement actions, the key cases and the midterm results, with a card that holds all of it. Legislation, Enforcement and Cases show their own data alone. The map's states carry no letters of their own (pointing at one names it in the panel); #legTiles
           holds one button for each state too small to point at, which the script adds. The bills table is paged (#legBillsPager), and the bills arrive in a file of their own. The masthead above, one for all four sections, is
           govLede() and govMasthead() in src/js/60-legislation.js (TAB_DESCS in src/js/70-render.js gives all four sections the same). The place chosen in the Show menu (or on the map) is shared by the four. -->
      <div id="legislationArea">
        <!-- The toolbar sticks at the top of the window, and the topic chips and the search bar stick under it, in every section (the owner's request, 2026-11-18: the topics belong to the sticky bar); all three scroll
             with the page on a phone and on a short window (src/styles/legislation.css, #legSticky, #legTopicsBar and #legFilters). -->
        <div class="leg-sticky controls" id="legSticky">
          <div class="leg-controls">
            <div class="leg-controls-main">
            <div class="pol-subview-toggle" id="govSwitch" role="group" aria-label="Section of Government action">
              <button class="pol-subview-btn" type="button" id="govSwitchAll" data-gov="all" aria-pressed="false">All</button>
              <button class="pol-subview-btn" type="button" id="govSwitchCases" data-gov="cases" aria-pressed="false">Cases</button>
              <button class="pol-subview-btn" type="button" id="govSwitchEnforcement" data-gov="enforcement" aria-pressed="false">Enforcement</button>
              <button class="pol-subview-btn" type="button" id="govSwitchLegislation" data-gov="legislation" aria-pressed="false">Legislation</button>
            </div>
            <div class="leg-select-pair" id="legShowPair">
              <label class="leg-ctl-label" for="legStateSelect">Show</label>
              <select id="legStateSelect" class="leg-select"><option value="">All jurisdictions</option></select>
            </div>
            <span class="ctl-pair gov-leg-only" id="legStatusPair">
              <label class="ctl-label" for="legStatus">Status</label>
              <select id="legStatus" aria-label="Filter by status"><option value="">All statuses</option></select>
            </span>
            <label class="ctl-check gov-leg-only" id="legPassingWrap" hidden>
              <input type="checkbox" id="legPassing"> Include bills that only lightly mention AI <span class="leg-muted-count" id="legPassingCount"></span>
            </label>
            </div>
            <button class="reset-btn leg-reset" type="button" id="legReset" title="Reset the jurisdiction, every filter in every section and the order, and return to All"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg><span id="legResetText">Reset all</span></button>
          </div>
        </div>
        <!-- The topic chips, always showing and sticking with the toolbar and the search bar: the bills' own on Legislation (#legTopicPills) and the lists' on Enforcement and Cases (#enfTopicPills). There was a note under the
             bills' chips that said what a topic is and how many bills have none; the owner had it taken out on 2026-11-18 (the rule is in docs/legislation-sources.md, and the About page says it in a sentence). -->
        <div class="leg-topics controls" id="legTopicsBar">
          <div class="pill-row gov-leg-only" id="legTopicPills" role="group" aria-label="Filter by topic"></div>
          <div class="pill-row gov-lists-only" id="enfTopicPills" role="group" aria-label="Filter by topic"></div>
        </div>
        <!-- The search bar: the shared .controls bar (src/styles/filterbar.css, the same markup shape as Papers and the Fact Bank). The bills' search, Sort and result line, or the lists' search and result line. -->
        <div class="controls" id="legFilters" role="region" aria-label="Search and filter">
          <div class="controls-row">
            <div class="search-wrap gov-leg-only">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="legSearch" placeholder="Search bills, states, topics…" aria-label="Search the legislation" autocomplete="off">
            </div>
            <div class="search-wrap gov-lists-only" id="enfSearchWrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="enfSearch" placeholder="Search the enforcement actions…" aria-label="Search the enforcement actions" autocomplete="off">
            </div>
            <span class="ctl-pair gov-lists-only" id="enfSortPair">
              <label class="ctl-label" for="enfSort">Sort</label>
              <select id="enfSort" aria-label="Sort the enforcement actions">
                <option value="recent" selected>Most recent</option>
                <option value="oldest">Oldest</option>
                <option value="jurisdiction">Jurisdiction</option>
              </select>
            </span>
            <span class="ctl-pair gov-leg-only">
              <label class="ctl-label" for="legSort">Sort</label>
              <select id="legSort" aria-label="Sort the legislation">
                <option value="recent" selected>Most recent action</option>
                <option value="oldest">Oldest action</option>
                <option value="jurisdiction">Jurisdiction</option>
              </select>
            </span>
          </div>
          <div class="result-row gov-leg-only">
            <div class="result-line" id="legResultLine" aria-live="polite"></div>
          </div>
          <div class="result-row gov-lists-only" id="enfResultRow">
            <div class="result-line" id="enfResultLine" aria-live="polite"></div>
          </div>
        </div>
        <div class="leg-stage" id="legStage">
          <div class="leg-map-wrap">
            <div class="leg-map-box" id="legMapBox">
              <svg id="legMap" class="leg-map" viewBox="0 0 975 610" role="img" aria-label="Map of the United States. Choose a state, or Federal, in the Show menu; the panel and the list follow it."></svg>
              <div class="leg-tiles" id="legTiles" role="group" aria-labelledby="legTilesLabel"><span class="leg-tiles-label" id="legTilesLabel">Small states</span></div>
            </div>
            <div class="leg-legend" id="legLegend"></div>
            <p class="leg-map-source" id="legMapSource"></p>
          </div>
          <div class="leg-panel-slot"><aside class="leg-panel" id="legPanel" aria-label="Selected state"></aside></div>
        </div>
        <!-- The midterm results, by state, at the head of All (they were a view of their own until 2026-11-18; the owner asked for that view to go and the table to stay, then for All, which holds everything, and then for them first): ten states to a
             page, each row linking to AP's pages for that state's races, the pinned jurisdiction narrowing it to its row. -->
        <section class="leg-section gov-all-only" id="legResultsSection" aria-labelledby="legResultsTitle">
          <h2 class="leg-section-title" id="legResultsTitle"><span class="leg-scope leg-scope--title" id="legResultsScope"></span></h2>   <!-- "Arkansas · 2026 Midterm results": the place, then what the table is, as the other sections' titles are written -->
          <div class="leg-table-wrap" id="legResultsTable" tabindex="-1"></div>
          <p class="leg-source" id="legSource"></p>
          <nav class="pager" id="legResultsPager" hidden></nav>
        </section>
        <!-- Legislation's list: the bills, ten to a page. -->
        <section class="leg-section gov-leg-only" id="legBillsSection" aria-label="Bills">
          <h2 class="leg-section-title" id="legBillsTitle"><span class="leg-scope leg-scope--title" id="legBillsScope"></span></h2>
          <div class="leg-stats" id="legBillsStats" hidden></div>
          <div class="leg-table-wrap" id="legBillsTable" tabindex="-1"></div>
          <p class="leg-source" id="legBillsNote"></p>
          <nav class="pager" id="legBillsPager" hidden></nav>
        </section>
        <!-- ── ENFORCEMENT and CASES' list ── One area serves both: the open view (enforcement or cases) says which kind of row of data/legislation-actions.js is listed (the row format and the rules for it
             are at the top of that file); src/js/55-enforcement.js draws it. Until that file has a row of the kind this is a placeholder: the one note below (the masthead above is the tab's, the same in every section),
             and the lists' own controls above are hidden. The first row of the kind hides the note and shows #enfLive. -->
        <div id="enforcementArea">
          <p class="placeholder-note" id="enfPlaceholder"><span class="placeholder-note-label">Placeholder</span>Nothing is here yet. <span id="enfPlaceholderWhat">Enforcement actions</span> will be listed here. For now, the bills are in <a href="#legislation">Legislation</a>.</p>
          <div id="enfLive" hidden>
            <!-- The lists, each with its own count, its table, the note under the table (ENF_NOTE) and its pager: src/js/55-enforcement.js writes them here. A note sits under its table and above the divider that starts the pager (the owner, 2026-11-18). -->
            <div id="enfLists"></div>
          </div>
        </div>
        <div class="sr-only" id="legAnnounce" aria-live="polite"></div>
      </div>
