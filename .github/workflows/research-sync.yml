name: Sync research from Google Sheet

# Pulls the published research Google Sheet, regenerates data/tracker-data.js via
# tools/research.py, and commits the result back to the default branch. Ids stay
# stable across runs because build --sheet reconciles them against the committed
# content/research.csv snapshot (see tools/research.py / content/README.md).
#
# What reaches the site: only rows whose `status` is "approved". Rows that are under
# review (or blank) or archived are kept in the snapshot and never published. A status
# or foundational word that is not allowed, or an approved row that is incomplete,
# makes this run fail and leaves the site as it was. (A Sheet with no `status` column
# yet is read the old way: any text in `archived` hides the row.)
#
# ── ONE-TIME SETUP on GitHub (Claude can't do these; they're in the repo UI) ──
#   1. Publish the Sheet as CSV: in Google Sheets, File > Share > Publish to web
#      > pick the tab > Comma-separated values (.csv) > Publish. Copy that link.
#      (The Sheet must stay publicly readable, or the runner gets a login page.)
#   2. Repo Settings > Secrets and variables > Actions > Variables tab >
#      New repository variable:  name RESEARCH_SHEET_URL,  value = that link.
#      (A "variable" not a "secret" because a published link is already public;
#       to hide it from logs, store it as a secret instead and change vars.-> secrets. below.)
#   3. Repo Settings > Actions > General > Workflow permissions >
#      "Read and write permissions" (lets the run commit the update).
#
# Then it runs on the schedule below, or on demand: Actions tab > this workflow
# > "Run workflow". Change the cron (or delete the schedule block) to taste.
#
# ── THE CASES AND ENFORCEMENT TABS (same Sheet, a second step) ────────────────────────
# The `cases` and `enforcement` tabs of the same Sheet are the master for the key cases and
# the enforcement actions, and this run is the only writer of data/legislation-actions.js and
# of their snapshots content/cases.csv and content/enforcement.csv (tools/actions.py; the
# columns are in content/README.md). One-time setup, like the research tab's:
#   4. In Google Sheets, publish EACH of the two tabs as CSV (File > Share > Publish to web >
#      pick the tab > Comma-separated values (.csv) > Publish) and copy the two links.
#   5. Repo Settings > Secrets and variables > Actions > Variables > two more repository
#      variables:  CASES_SHEET_URL  and  ENFORCEMENT_SHEET_URL  (one link each).
# Until BOTH are set the step prints a notice and leaves the two lists as they are. A row that
# does not pass the rules (a typo in a status, an approved row with no source) fails only that
# step: the research is still synced and committed, and the run ends red so the row gets fixed.
# Only rows whose `status` is "approved" reach the site. A published tab is readable by anyone
# with its link, rows under review and the `notes` column included.

on:
  workflow_dispatch: {}            # manual "Run workflow" button
  schedule:
    - cron: "0 13 * * *"           # daily ~13:00 UTC (~9am ET / 6am PT)

permissions:
  contents: write                  # so the built-in token can push the commit

concurrency:                       # never let two syncs overlap
  group: research-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Pull the sheet and rebuild
        env:
          SHEET_URL: ${{ vars.RESEARCH_SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::Repository variable RESEARCH_SHEET_URL is not set. See this workflow's header for setup."
            exit 1
          fi
          python3 tools/research.py build --sheet "$SHEET_URL"

      - name: Pull the cases and enforcement tabs and rebuild
        id: actions
        continue-on-error: true    # a bad row there must not hold back the research
        env:
          CASES_URL: ${{ vars.CASES_SHEET_URL }}
          ENFORCEMENT_URL: ${{ vars.ENFORCEMENT_SHEET_URL }}
        run: |
          if [ -z "$CASES_URL" ] || [ -z "$ENFORCEMENT_URL" ]; then
            echo "::notice::CASES_SHEET_URL and ENFORCEMENT_SHEET_URL are not both set, so the cases and enforcement lists are left as they are. See the header of this workflow."
            exit 0
          fi
          python3 tools/actions.py build --cases "$CASES_URL" --enforcement "$ENFORCEMENT_URL"

      - name: Commit and push if anything changed
        run: |
          FILES="content/research.csv data/tracker-data.js content/cases.csv content/enforcement.csv data/legislation-actions.js"
          if git diff --quiet -- $FILES; then
            echo "No changes; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Sync research, cases and enforcement from Google Sheet"
            git push
          fi

      - name: End red if the cases and enforcement pull failed
        if: steps.actions.outcome == 'failure'
        run: |
          echo "::error::The cases and enforcement tabs were NOT synced: the step above names the row to fix. The research was synced."
          exit 1
