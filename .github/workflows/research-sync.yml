name: Sync research from Google Sheet

# Pulls the published research Google Sheet, regenerates data/tracker-data.js via
# tools/research.py, and commits the result back to the default branch. Ids stay
# stable across runs because build --sheet reconciles them against the committed
# content/research.csv snapshot (see tools/research.py / content/README.md).
#
# ── ONE-TIME SETUP on GitHub (Claude can't do these; they're in the repo UI) ──
#   1. Publish the Sheet as CSV: in Google Sheets, File > Share > Publish to web
#      > pick the tab > Comma-separated values (.csv) > Publish. Copy that link.
#      (The Sheet must stay publicly readable, or the runner gets a login page.)
#   2. Repo Settings > Secrets and variables > Actions > Variables tab >
#      New repository variable:  name RESEARCH_SHEET_URL,  value = that link.
#      (A "variable" not a "secret" because a published link is already public;
#       to hide it from logs, store it as a secret instead and change vars.-> secrets. below.)
#   3. Repo Settings > Actions > General > Workflow permissions >
#      "Read and write permissions" (lets the run commit the update).
#
# Then it runs on the schedule below, or on demand: Actions tab > this workflow
# > "Run workflow". Change the cron (or delete the schedule block) to taste.

on:
  workflow_dispatch: {}            # manual "Run workflow" button
  schedule:
    - cron: "0 13 * * *"           # daily ~13:00 UTC (~9am ET / 6am PT)

permissions:
  contents: write                  # so the built-in token can push the commit

concurrency:                       # never let two syncs overlap
  group: research-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull the sheet and rebuild
        env:
          SHEET_URL: ${{ vars.RESEARCH_SHEET_URL }}
        run: |
          if [ -z "$SHEET_URL" ]; then
            echo "::error::Repository variable RESEARCH_SHEET_URL is not set. See this workflow's header for setup."
            exit 1
          fi
          python3 tools/research.py build --sheet "$SHEET_URL"

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- content/research.csv data/tracker-data.js; then
            echo "No research changes; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/research.csv data/tracker-data.js
            git commit -m "Sync research from Google Sheet"
            git push
          fi
