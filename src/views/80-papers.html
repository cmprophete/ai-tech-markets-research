
      <!-- Papers, the Database sub-view: the search-and-filters bar, then the list. The bar is the
           Fact Bank's (same markup shape, same styles: src/styles/filterbar.css) with this tab's
           facets, laid out as the Government action tab's bar is (the owner, 2026-11-18: the same structure): the toolbar (Category, Methodology and Region, always showing, with the Reset button at its right end), then the search bar
           (search, Sort and the result line), each sticky under the one before (src/styles/filterbar.css, src/js/00-state.js syncBarStack). -->
      <div id="papersArea">
        <div class="bar-toolbar controls" id="ppToolbar">
          <div class="bar-toolbar-row">
            <div class="bar-toolbar-main">
            <span class="ctl-pair">
              <label class="ctl-label" for="ppCategory">Category</label>
              <select id="ppCategory" aria-label="Filter by category">
                <option value="all">All categories</option>
              </select>
            </span>
            <span class="ctl-pair">
              <label class="ctl-label" for="ppMethod">Methodology</label>
              <select id="ppMethod" aria-label="Filter by methodology">
                <option value="all">All types</option>
              </select>
            </span>
            <span class="ctl-pair">
              <label class="ctl-label" for="ppRegion">Region</label>
              <select id="ppRegion" aria-label="Filter by region">
                <option value="all">All regions</option>
              </select>
            </span>
            </div>
            <button class="reset-btn" type="button" id="ppReset" title="Reset the search, the order and every filter"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg><span id="ppResetText">Reset all</span></button>
          </div>
        </div>
        <div class="bar-search controls" id="ppFilters" role="region" aria-label="Search and filters">
          <div class="controls-row">
            <div class="search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="search" id="ppSearch" placeholder="Search papers, authors, findings…" aria-label="Search papers">
            </div>
            <span class="ctl-pair">
              <label class="ctl-label" for="ppSort">Sort</label>
              <select id="ppSort" aria-label="Sort papers">
                <option value="desc" selected>Newest first</option>
                <option value="asc">Oldest first</option>
              </select>
            </span>
          </div>
          <div class="result-row">
            <div class="result-line" id="ppResultLine" aria-live="polite"></div>
          </div>
        </div>
        <div class="sr-only" id="ppAnnounce" aria-live="polite"></div>

        <div class="cards-grid" id="cardsGrid" tabindex="-1"></div>
        <nav class="pager" id="ppPager" hidden></nav>
        <div class="empty-state" id="emptyState">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <h3>No results</h3>
          <p>Try adjusting your search or clearing filters.</p>
          <button id="emptyStateClear" style="display:none;margin-top:12px;background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius: var(--r-ctl);padding:7px 16px;font-size: 13px;cursor:pointer;font-family:inherit">Clear all filters</button>
        </div>
      </div>
    </div>
